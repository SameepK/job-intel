<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Intel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 380px;
      min-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
    }

    .header {
      background: #1a1a1a;
      padding: 16px 20px;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header h1 { font-size: 16px; font-weight: 600; color: #fff; }
    .header span { font-size: 11px; color: #666; margin-left: auto; }

    .badge {
      background: #7c3aed;
      color: white;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
    }

    .main { padding: 20px; }

    .track-btn {
      width: 100%;
      padding: 14px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .track-btn:hover { background: #6d28d9; }
    .track-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

    .status-box {
      margin-top: 16px;
      padding: 14px;
      background: #1a1a1a;
      border-radius: 10px;
      border: 1px solid #2a2a2a;
      display: none;
    }

    .status-box.visible { display: block; }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .status-row:last-child { margin-bottom: 0; }
    .label { font-size: 12px; color: #888; }
    .value { font-size: 13px; font-weight: 500; color: #fff; }

    .pill {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .pill.apply { background: #065f46; color: #34d399; }
    .pill.skip { background: #7f1d1d; color: #f87171; }
    .pill.cautious { background: #78350f; color: #fbbf24; }
    .pill.likely { background: #065f46; color: #34d399; }
    .pill.unlikely { background: #7f1d1d; color: #f87171; }
    .pill.unknown { background: #1e3a5f; color: #60a5fa; }

    .score-bar {
      width: 100%;
      height: 6px;
      background: #2a2a2a;
      border-radius: 3px;
      margin-top: 4px;
      overflow: hidden;
    }

    .score-fill {
      height: 100%;
      background: #7c3aed;
      border-radius: 3px;
      transition: width 0.5s ease;
    }

    .divider { height: 1px; background: #2a2a2a; margin: 12px 0; }

    .error-box {
      margin-top: 16px;
      padding: 12px;
      background: #1a0a0a;
      border: 1px solid #7f1d1d;
      border-radius: 10px;
      font-size: 12px;
      color: #f87171;
      display: none;
    }

    .error-box.visible { display: block; }

    .loading {
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      font-size: 13px;
      color: #888;
      display: none;
    }

    .loading.visible { display: flex; }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #333;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .step { font-size: 11px; color: #666; margin-top: 4px; }

    .view-all {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      background: transparent;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #888;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .view-all:hover { border-color: #7c3aed; color: #fff; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="popup.js"></script>
</body>
</html>
